<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9dfd1" />
    <meta name="description" content="由 JSON 驱动的个人 WebXR 照片博物馆" />
    <title>个人旅行博物馆</title>
  </head>
  <body>
    <div id="app-shell">
      <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
        <div class="loading-mark" aria-hidden="true"></div>
        <p class="eyebrow">PERSONAL ARCHIVE</p>
        <h1 id="loading-title">正在准备博物馆</h1>
        <p id="loading-detail">读取展馆配置与大厅资源…</p>
        <div class="loading-track"><span id="loading-progress"></span></div>
      </div>

      <div id="dom-overlay">
      <header id="museum-header" class="museum-header is-hidden">
        <div>
          <p class="eyebrow">PERSONAL MUSEUM</p>
          <h1 id="museum-title">个人旅行博物馆</h1>
          <p id="room-title">大厅</p>
        </div>
        <button id="help-toggle" class="quiet-button" type="button" aria-expanded="false">参观提示</button>
      </header>

      <aside id="help-panel" class="help-panel is-hidden" aria-label="参观提示">
        <button id="help-close" class="close-button" type="button" aria-label="关闭">×</button>
        <p class="eyebrow">HOW TO VISIT</p>
        <h2>自由参观</h2>
        <dl>
          <div><dt>桌面</dt><dd>鼠标观察，WASD 行走，点击门加载下一个房间。</dd></div>
          <div><dt>VR</dt><dd>控制器或手势射线开门，摇杆移动，也可瞬移。</dd></div>
          <div><dt>照片</dt><dd>靠近并注视照片时自动切换到原始画质。</dd></div>
        </dl>
      </aside>

      <div id="toast" class="toast is-hidden" role="status" aria-live="polite"></div>
      <div id="crosshair" aria-hidden="true"></div>
      </div>

      <a-scene
        id="museum-scene"
        embedded
        background="color: #d9e3e8"
        renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.25; toneMapping: ACESFilmic; antialias: true"
        webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking; overlayElement: #dom-overlay"
        xr-mode-ui="XRMode: vr"
        loading-screen="enabled: false"
        shadow="type: pcf"
      >
        <a-assets timeout="120000"></a-assets>
        <a-entity id="museum-root"></a-entity>

        <a-entity id="camera-rig" position="0 0 0" museum-walk-constraint desktop-movement="camera: #head; speed: 3.2" xr-thumbstick-move="camera: #head; hand: right; speed: 2.2">
          <a-entity
            id="head"
            camera="near: 0.05; far: 180"
            look-controls="pointerLockEnabled: true"
            position="0 1.65 0"
          >
            <a-entity
              id="desktop-cursor"
              cursor="rayOrigin: mouse; fuse: false"
              raycaster="objects: .interactive; far: 20"
            ></a-entity>
          </a-entity>

          <a-entity
            id="left-controller"
            laser-controls="hand: left"
            raycaster="objects: .interactive, .navmesh; far: 30"
            cursor="rayOrigin: entity; fuse: false"
            blink-controls="cameraRig: #camera-rig; teleportOrigin: #head; collisionEntities: .navmesh; rotateOnTeleport: false"
          ></a-entity>
          <a-entity
            id="right-controller"
            laser-controls="hand: right"
            raycaster="objects: .interactive; far: 20"
            cursor="rayOrigin: entity; fuse: false"
          ></a-entity>
          <a-entity id="left-hand" hand-tracking-controls="hand: left; modelStyle: mesh" hand-ray-click="hand: left"></a-entity>
          <a-entity id="right-hand" hand-tracking-controls="hand: right; modelStyle: mesh" hand-ray-click="hand: right"></a-entity>
        </a-entity>

        <a-entity light="type: ambient; color: #f5eadc; intensity: 1.05"></a-entity>
        <a-entity light="type: directional; color: #fff9ef; intensity: 1.35; castShadow: true" position="-8 16 6"></a-entity>
      </a-scene>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
